# Dependabot configuration (issue #110).
#
# Three lockfiles are committed — backend/package-lock.json,
# frontend/package-lock.json and contracts/Cargo.lock — so a dependency version
# only moves when something bumps it. Without these entries an advisory-driven
# bump never arrives on its own; it waits for a human to read the advisory feed.
#
# Minor and patch updates are grouped into one PR per ecosystem to keep the noise
# down. Majors are deliberately left ungrouped so a breaking change (e.g. a
# @stellar/stellar-sdk or soroban-sdk major) is reviewed and tested on its own
# instead of riding along with a batch of routine bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      contracts-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The workflows pin actions by major tag (actions/checkout@v4,
  # dtolnay/rust-toolchain@stable, …); these PRs move those tags.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
